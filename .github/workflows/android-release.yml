name: Android Release Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Compile Release APK
    runs-on: ubuntu-latest

    # Declared at job level so that every step's `if:` can see it. A `step.env`
    # value is NOT visible to that same step's `if:` expression, which is why
    # the keystore install step used to be silently skipped on every run.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore written to app/release.keystore"

      - name: Verify Signing Configuration
        run: |
          set -euo pipefail
          missing=""
          [ -f app/release.keystore ] || missing="$missing keystore"
          [ -n "${SIGNING_STORE_PASSWORD:-}" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "${SIGNING_KEY_ALIAS:-}" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "${SIGNING_KEY_PASSWORD:-}" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing material:$missing"
            echo "Add the KEYSTORE_BASE64 / SIGNING_* repository secrets before building a release."
            exit 1
          fi
          echo "All release signing material present."

      - name: Compile Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Antigravity Custom ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
