name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Kotlin + Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Pure JVM tests only: no device or emulator required.
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  python-tests:
    name: Overlay script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check overlay scripts
        run: |
          set -euo pipefail
          find app/src/main/assets -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Syntax-check overlay shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            # agy-daemon and friends are python files with a shell shebang shim.
            if head -n 2 "$script" | grep -q 'python3'; then
              continue
            fi
            bash -n "$script"
          done < <(find app/src/main/assets/overlay/bin app/src/main/assets/pkg -type f ! -name "*.awk" -print0)

      - name: Run daemon scheduler tests
        run: python3 -m unittest discover -s app/src/test/python -v
