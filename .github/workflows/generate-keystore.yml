name: Generate Release Keystore

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-keystore.yml"

permissions:
  contents: write

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Commit Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias antigravity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass antigravity123 \
            -keypass antigravity123 \
            -dname "CN=Antigravity, OU=Dev, O=Antigravity, L=City, S=State, C=US"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/release.keystore
          git commit -m "ci: commit permanent release keystore"
          git push origin main
