name: Generate Release Keystore

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-keystore.yml"

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore KuatoDev.jks \
            -alias kuatodev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass antigravity123 \
            -keypass antigravity123 \
            -dname "CN=Antigravity, OU=Dev, O=Antigravity, L=City, S=State, C=US"
          echo "===KEYSTORE_BASE64_START==="
          base64 -w 0 KuatoDev.jks
          echo ""
          echo "===KEYSTORE_BASE64_END==="
